<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TalkMaster{% endblock %} — Learn to Talk Like Anyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="nav-logo">🗣️</span>
            <span>TalkMaster</span>
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="https://github.com" target="_blank" class="nav-github">GitHub</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>TalkMaster — Learn to talk like anyone you want to be.</p>
        <p class="footer-sub">Built with Flask · Open source</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
